#cloud-config
packages:
  - curl
  - coreutils

runcmd:
  - |
    set -eu
    GATEWAY_URL="https://gateway.example.com"
    curl -fsSLo /tmp/install_agent.sh https://raw.githubusercontent.com/NexGenCloud/hyperstack-agent/main/scripts/install_agent.sh
    chmod 0755 /tmp/install_agent.sh
    /tmp/install_agent.sh "$GATEWAY_URL"
