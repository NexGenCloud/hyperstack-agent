version: "3"

vars:
  BINARY_NAME: hyperstack-agent
  AMD64_BIN: bin/{{.BINARY_NAME}}-linux-amd64
  AMD64_SHA: bin/{{.BINARY_NAME}}-linux-amd64.sha256
  TOOL_BIN: .tools/bin

tasks:
  tools:
    desc: Install pinned local verification tools into .tools/bin.
    run: once
    cmds:
      - ./scripts/bootstrap_tools.sh

  build:
    desc: Build the linux/amd64 agent binary.
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o bin/{{.BINARY_NAME}}-linux-amd64 ./cmd/agent

  build-linux-amd64:
    desc: Build the linux/amd64 agent binary.
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o bin/{{.BINARY_NAME}}-linux-amd64 ./cmd/agent

  build-linux-arm64:
    desc: Build the linux/arm64 agent binary.
    cmds:
      - GOOS=linux GOARCH=arm64 go build -o bin/{{.BINARY_NAME}}-linux-arm64 ./cmd/agent

  run:
    desc: Run the agent locally.
    cmds:
      - go run ./cmd/agent

  test:
    desc: Run Go tests.
    cmds:
      - go test ./...

  lint:
    desc: Run Go lint checks.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" golangci-lint run ./...

  security:
    desc: Run Go security checks.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" gosec ./...

  govulncheck:
    desc: Run Go vulnerability checks.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" CGO_ENABLED=1 govulncheck ./...

  trivy-fs:
    desc: Run filesystem vulnerability, secret, and misconfiguration scan.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

  sbom:
    desc: Generate a CycloneDX SBOM with Trivy.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" trivy fs --format cyclonedx --output sbom.cdx.json .

  shellcheck:
    desc: Run shell script lint checks.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" shellcheck scripts/*.sh

  secrets:
    desc: Run secret scanning.
    deps: [tools]
    cmds:
      - PATH="{{.TOOL_BIN}}:$PATH" gitleaks detect --source . --redact --no-banner

  verify:
    desc: Run all local verification checks.
    deps: [tools]
    cmds:
      - task: test
      - task: shellcheck
      - task: lint
      - task: security
      - task: govulncheck
      - task: trivy-fs
      - task: secrets

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -rf bin

  static:
    desc: Build a static linux/amd64 agent binary.
    cmds:
      - CGO_ENABLED=0 go build -trimpath -a -ldflags '-s -w -extldflags "-static"' -o bin/{{.BINARY_NAME}}-static ./cmd/agent

  release-agent:
    desc: Build the linux/amd64 release artifact and checksum.
    cmds:
      - task: build-linux-amd64
      - sha256sum "{{.AMD64_BIN}}" > "{{.AMD64_SHA}}"
      - echo "Wrote {{.AMD64_BIN}} and {{.AMD64_SHA}}"

  release-agent-full:
    desc: Build all release artifacts and checksums.
    cmds:
      - ./scripts/build.sh
